[project]
name = "harness-check"
version = "0.1.0"
description = "Validate a robot's electrical system (power budget, voltage drop, connector/fuse ratings, pin conflicts) from a single YAML spec."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["robotics", "electronics", "wiring-harness", "power-budget", "validation"]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
harness-check = "harness_check.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
